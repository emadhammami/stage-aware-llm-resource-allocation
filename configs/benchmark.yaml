quixbugs:
  repo_url: "https://github.com/jkoppel/QuixBugs.git"
  commit_sha: "4257f44b0ff1181dedaedee6a447e133219fcebf"
  local_path: ".benchmarks/QuixBugs"
  python_programs_dir: "python_programs"
  python_tests_dir: "python_testcases"
  timeout_seconds: 10
  tasks:
    - bitcount
    - breadth_first_search
    - bucketsort
    - depth_first_search
    - detect_cycle
    - find_first_in_sorted
    - find_in_sorted
    - flatten
    - gcd
    - get_factors
    - hanoi
    - is_valid_parenthesization
    - kheapsort
    - knapsack
    - kth
    - lcs_length
    - levenshtein
    - lis
    - longest_common_subsequence
    - max_sublist_sum
    - mergesort
    - minimum_spanning_tree
    - next_palindrome
    - next_permutation
    - pascal
    - possible_change
    - powerset
    - quicksort
    - reverse_linked_list
    - rpn_eval
    - shortest_paths
    - shortest_path_length
    - shortest_path_lengths
    - shunting_yard
    - sieve
    - sqrt
    - subsequences
    - topological_ordering
    - to_base
    - wrap
