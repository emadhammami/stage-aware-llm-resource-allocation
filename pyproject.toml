[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gated-budget-aware-code-repair"
version = "0.1.0"
description = "Controlled QuixBugs benchmark for evidence-guided budget-aware LLM code repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "safetensors>=0.8.0",
    "types-PyYAML>=6.0",
]
local-models = [
    "accelerate>=1.10.1",
    "hf-xet>=1.6.0",
    "safetensors>=0.8.0",
    "torch>=2.11",
    "transformers>=5.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "benchmark*", "analysis*", "workflow_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires external services or downloaded benchmarks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pytest_tmp", "analysis/stage_aware/make_figure1_operating_envelope.py", "analysis/stage_aware/make_figure2_primary_confirmatory.py", "analysis/stage_aware/make_remaining_paper_figures.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
    "workflow_control",
    "analysis/stage_aware",
    "benchmark/hotpotqa.py",
    "benchmark/pilot60.py",
    "benchmark/quixbugs.py",
]

[[tool.mypy.overrides]]
module = ["agent.models"]
disable_error_code = ["import-untyped"]
